<!doctype html><html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>Data San Luis</title>
<style>body{font-family:system-ui,sans-serif;background:#0f172a;color:#e2e8f0;display:grid;place-items:center;
min-height:100vh;margin:0;text-align:center;padding:16px}a{color:#60a5fa}</style></head><body>
<div id="m"><h1>Data San Luis</h1><p>Abriendo la redacción…</p></div>
<script>
fetch("tunel.json?t="+Date.now(),{cache:"no-store"}).then(r=>r.json()).then(d=>{
  if(!d.url) throw 0;
  document.getElementById("m").innerHTML='<h1>Data San Luis</h1><p>Abriendo la redacción…</p><p><a href="'+d.url+'">Entrar</a></p>';
  location.replace(d.url+location.hash);
}).catch(()=>{document.getElementById("m").innerHTML=
  "<h1>Data San Luis</h1><p>La redacción está apagada en este momento. Probá de nuevo en un rato.</p>"});
</script></body></html>
